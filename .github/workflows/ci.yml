name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -c "from app.main import app; assert app.title"
      - run: docker build -t resume-match-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config
      - name: Start app
        run: docker compose up -d --build
      - name: Verify full-stack application
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health | grep -q 'ok'; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8000/health | grep -q 'ok'

          MATCH=$(curl --fail --silent -X POST http://localhost:8000/match \
            -H 'Content-Type: application/json' \
            -d '{"resume_text":"Python developer with FastAPI Docker PostgreSQL","job_description":"Python FastAPI Docker PostgreSQL Redis"}')
          python -c 'import json,sys; data=json.load(sys.stdin); assert data["match_score"] > 0; assert "redis" in data["missing_keywords"]' <<< "$MATCH"

          for i in {1..30}; do
            if curl --fail --silent http://localhost:5173/ | grep -q '<div id="root"></div>'; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
